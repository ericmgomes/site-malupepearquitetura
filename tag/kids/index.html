<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    URL legada do WordPress (arquivo da tag "kids"). O GitHub Pages não faz
    redirect 301, então este stub usa meta refresh + canonical, que o Google
    trata como redirecionamento permanente.
  -->
  <title>Redirecionando para o blog — Malu Pepe Arquitetura</title>
  <link rel="canonical" href="https://malupepearquitetura.com.br/blog/">
  <meta http-equiv="refresh" content="0; url=/blog/">
  <meta name="robots" content="noindex, follow">
  <script>window.location.replace('/blog/');</script>
</head>
<body>
  <p>Esta página foi movida. Se você não for redirecionado, acesse o <a href="/blog/">blog da Malu Pepe Arquitetura</a>.</p>
</body>
</html>
